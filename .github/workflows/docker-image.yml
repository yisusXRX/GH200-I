name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4
    - name: Usar accion docker  
      uses: ./.github/actions/action-docker
      with:
        nombre: "cambio el valor"
